name = "jacobian"
defaultTargets = ["Jacobian"]

# These mirror `Vilin97/lean-pool`'s own lakefile, so that a build here sees exactly the
# warnings the pool's build of this project would see — `mathlibStandardSet` in particular
# turns on mathlib's syntax linters (`style.longLine`, `style.cdot`, `flexible`, …).
[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "51e6992efd06126df61a496bebf8f49482a4e129"

[[lean_lib]]
name = "Jacobian"
globs = ["Jacobian", "Jacobian.+"]
